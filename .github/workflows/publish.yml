name: Publish to NPM

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # necessário para Trusted Publishing (OIDC) no npm

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24' # npm >= 11.5.1 é exigido pelo Trusted Publishing
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci
      - run: npm run build:lib
      - run: cd dist/dynamic-form && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
